[tool.poetry]
name = "automojo-credentials"
description = "Automation Mojo - Credentials Package"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="automojo", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
automojo-configuration = { git = "https://github.com/automationmojo/automojo-configuration.git", branch = "main" }

[tool.poetry.group.dev.dependencies]

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
